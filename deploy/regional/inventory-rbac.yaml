# Template only. Apply only after reviewing the namespace and node names.
# Mount a projected, short-lived service-account token explicitly into primary
# Pods; keep automountServiceAccountToken:false on all regional Pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sub2api-inventory
  namespace: sub2api-primary
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sub2api-inventory
  namespace: sub2api-primary
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [statefulsets, deployments, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sub2api-inventory
  namespace: sub2api-primary
subjects:
  - kind: ServiceAccount
    name: sub2api-inventory
    namespace: sub2api-primary
roleRef:
  kind: Role
  name: sub2api-inventory
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sub2api-inventory-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [REPLACE_WITH_ALLOWED_NODE_NAME]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sub2api-inventory-nodes
subjects:
  - kind: ServiceAccount
    name: sub2api-inventory
    namespace: sub2api-primary
roleRef:
  kind: ClusterRole
  name: sub2api-inventory-nodes
  apiGroup: rbac.authorization.k8s.io
