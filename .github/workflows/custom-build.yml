name: Custom build

on:
  push:
    branches: [custom]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image and built-in updater release
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

concurrency:
  group: custom-build-${{ inputs.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Image metadata
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Three-part calendar versions work with the existing updater.
          echo "version=$(date -u +%Y.%-m).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify custom feature regressions
        working-directory: backend
        run: |
          go test -tags unit ./internal/service -run 'Test(UpdateService|LocalZIP|Backup|Restore|AccountRequestTimezone|HTTPUpstream)' -count=1
          go test -tags unit ./internal/service ./internal/server/middleware ./internal/handler/admin -run TestAccountViewer -count=1
          go test ./internal/pkg/timezone ./internal/repository -run TestSystemTimezone -count=1
          go test -tags unit ./internal/service ./internal/handler/dto ./internal/handler/admin -run TestSystemTimezone -count=1
          go test ./internal/reauthruntime -count=1
          go test ./internal/repository -run 'Test(EnsureBootstrapSecrets|PgDumperRestoreStopsOnSQLFailure)' -count=1
      - name: Verify custom release notes and README merges
        run: python -m unittest discover -s .github/release-tools -p test_custom_release_notes.py
      - name: Verify persistent Docker updates
        run: /bin/sh deploy/tests/docker-persistent-update-test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build and validate matching managed login runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/reauth-runtime/Dockerfile
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/custom-reauth
          cache-from: type=gha,scope=custom-reauth
          cache-to: type=gha,mode=max,scope=custom-reauth
      - name: Archive managed login runtime
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          mkdir -p reauth-output
          tar --dereference -czf "reauth-output/sub2api-reauth_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/custom-reauth" .
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend and backend; optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:custom
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ steps.image.outputs.sha }}
            UPDATE_REPO=${{ github.repository }}
            PERSISTENT_UPDATES=1
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=custom-build
          cache-to: type=gha,mode=max,scope=custom-build
      - name: Verify the image starts with the embedded release version
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE:$VERSION" --version 2>&1 | grep -F "Sub2API $VERSION (commit: $SOURCE_SHA,"
      - name: Publish image and matching updater archive
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Skip obsolete queued builds instead of publishing over a newer head.
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/custom" --jq .object.sha)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo 'Custom advanced during this build; skipping obsolete publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/custom-release"
          container=$(docker create "$IMAGE:$VERSION")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/sub2api" "$RUNNER_TEMP/custom-release/sub2api"
          docker cp "$container:/app/resources" "$RUNNER_TEMP/custom-release/resources"
          archive="sub2api_${VERSION}_linux_amd64.tar.gz"
          tar -C "$RUNNER_TEMP/custom-release" -czf "$RUNNER_TEMP/$archive" sub2api resources
          cp reauth-output/*.tar.gz "$RUNNER_TEMP/"
          (cd "$RUNNER_TEMP" && sha256sum "$archive" sub2api-reauth_*.tar.gz > checksums.txt)
          tag="v$VERSION"
          python .github/release-tools/custom_release_notes.py \
            --repo "$GITHUB_REPOSITORY" --version "$VERSION" --source "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/custom-release-notes.md"
          # Draft first: update checks must never see missing assets.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft \
              --title "Custom $VERSION" --notes-file "$RUNNER_TEMP/custom-release-notes.md"
          fi
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/custom-release-notes.md" --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/$archive" "$RUNNER_TEMP"/sub2api-reauth_*.tar.gz "$RUNNER_TEMP/checksums.txt" --clobber --repo "$GITHUB_REPOSITORY"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$SOURCE_SHA"
          docker push "$IMAGE:custom"
          gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          echo "Published $IMAGE:$VERSION and built-in update $tag from $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
