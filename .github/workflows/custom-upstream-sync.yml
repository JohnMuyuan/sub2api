name: Custom upstream sync

on:
  push:
    branches: [custom]
  schedule:
    # Every 30 minutes, away from the top-of-hour traffic peak.
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: custom-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
      runtime_changed: ${{ steps.merge.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
      - name: Merge upstream into the automation branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/ranxi2001/sub2api.git
          git fetch upstream production
          if git merge-base --is-ancestor upstream/production HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No upstream changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          merge_base=$(git merge-base HEAD upstream/production)
          upstream_files=$(git diff --name-only "$merge_base" upstream/production)
          if grep -Eq '^(tools/(openai_|test_openai_|reauth-runtime/)|backend/internal/reauthruntime/|\.github/workflows/reauth-runtime\.yml$)' <<< "$upstream_files"; then
            echo 'runtime_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime_changed=false' >> "$GITHUB_OUTPUT"
          fi
          previous=$(git ls-remote origin refs/heads/sync/upstream | cut -f1)
          git switch -c sync/upstream
          if ! git -c merge.keep-custom-readme.driver=true merge --no-edit upstream/production; then
            echo 'Upstream merge has conflicts. The custom branch was not changed. Resolve locally before retrying.' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push --force-with-lease="refs/heads/sync/upstream:$previous" origin HEAD:refs/heads/sync/upstream
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/custom-build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  ci:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/backend-ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  security:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/security-scan.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  runtime:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.runtime_changed == 'true'
    uses: ./.github/workflows/reauth-runtime.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  merge-and-release:
    needs: [prepare, validate, ci, security, runtime]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.changed == 'true' &&
          needs.validate.result == 'success' && needs.ci.result == 'success' &&
          needs.security.result == 'success' &&
          (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom
          fetch-depth: 0
      - name: Merge the validated commit and publish
        env:
          VALIDATED_SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Reusable workflows checked this exact candidate before merging.
          # Creating an immediately merged bot PR leaves approval-required
          # pull_request runs to expire without executing any checks.
          # No force: a concurrent custom commit rejects the push.
          git fetch origin sync/upstream
          git cat-file -e "$VALIDATED_SHA^{commit}"
          git push origin "$VALIDATED_SHA:refs/heads/custom"
          # GITHUB_TOKEN pushes do not trigger ordinary push workflows.
          gh workflow run custom-build.yml --ref custom -F publish=true
